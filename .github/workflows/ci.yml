name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go test and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/demo-grpc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/demo-grpc/go.mod
          cache-dependency-path: services/demo-grpc/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify go.mod and go.sum
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Format check
        run: |
          gofmt -w .
          git diff --exit-code

      - name: Run tests
        run: go test ./...

      - name: Build server
        run: go build -o /tmp/demo-grpc-server ./cmd/server

      - name: Build healthcheck client
        run: go build -o /tmp/demo-grpc-healthcheck ./cmd/healthcheck

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs:
      - go

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build demo-grpc image
        uses: docker/build-push-action@v6
        with:
          context: services/demo-grpc
          file: services/demo-grpc/Dockerfile
          push: false
          tags: demo-grpc:ci
          load: true

      - name: Inspect built image
        run: |
          docker image inspect demo-grpc:ci
          USER_VALUE="$(docker image inspect demo-grpc:ci --format '{{.Config.User}}')"
          echo "Image user: ${USER_VALUE}"

          if [ -z "${USER_VALUE}" ] || [ "${USER_VALUE}" = "0" ] || [ "${USER_VALUE}" = "root" ]; then
            echo "Image must not run as root."
            exit 1
          fi

  helm:
    name: Helm chart validation
    runs-on: ubuntu-latest
    needs:
      - go

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint charts/demo-grpc

      - name: Render Helm chart
        run: |
          mkdir -p /tmp/rendered
          helm template demo-grpc charts/demo-grpc \
            --namespace apps \
            > /tmp/rendered/demo-grpc.yaml

      - name: Check rendered Kubernetes security settings
        run: |
          grep -q "runAsNonRoot: true" /tmp/rendered/demo-grpc.yaml
          grep -q "allowPrivilegeEscalation: false" /tmp/rendered/demo-grpc.yaml
          grep -q "readOnlyRootFilesystem: true" /tmp/rendered/demo-grpc.yaml
          grep -q "RuntimeDefault" /tmp/rendered/demo-grpc.yaml
          grep -q "drop:" /tmp/rendered/demo-grpc.yaml
          grep -qE -- "^ +- ALL$" /tmp/rendered/demo-grpc.yaml
          grep -q "readinessProbe:" /tmp/rendered/demo-grpc.yaml
          grep -q "livenessProbe:" /tmp/rendered/demo-grpc.yaml
          grep -q "grpc:" /tmp/rendered/demo-grpc.yaml

  security:
    name: Trivy security scan
    runs-on: ubuntu-latest
    needs:
      - docker
      - helm

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build demo-grpc image for scanning
        uses: docker/build-push-action@v6
        with:
          context: services/demo-grpc
          file: services/demo-grpc/Dockerfile
          push: false
          tags: demo-grpc:local
          load: true

      - name: Install Trivy CLI
        env:
          TRIVY_VERSION: "0.69.3"
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            -o /tmp/trivy.tar.gz
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          sudo install -m 0755 /tmp/trivy /usr/local/bin/trivy
          trivy --version

      - name: Run Trivy filesystem scan
        run: |
          trivy fs \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            .

      - name: Render Helm chart for config scan
        run: |
          helm template demo-grpc charts/demo-grpc \
            --namespace apps \
            > /tmp/demo-grpc-rendered.yaml

      - name: Run Trivy Kubernetes config scan
        run: |
          trivy config \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            /tmp/demo-grpc-rendered.yaml

      - name: Run Trivy image scan
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            demo-grpc:local
