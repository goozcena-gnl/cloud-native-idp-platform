name: Plumber CI/CD Security

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: plumber-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plumber:
    name: Plumber gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      - name: Analyze GitHub Actions security
        uses: getplumber/plumber@7ad9d267ee5a00163cec9e5c749a088d5f565167  # v0.4.26
        with:
          version: v0.4.26
          verify-attestation: true
          config-file: .plumber.yaml
          min-score: A
          soft-fail: false
          score-push: false
          upload-sarif: true
          upload-artifacts: true
          artifact-name: plumber-security-reports
          output: plumber-report.json
          sarif: plumber.sarif
          pbom: plumber-pbom.json
          pbom-cyclonedx: plumber-cyclonedx-sbom.json
