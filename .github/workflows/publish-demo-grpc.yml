name: Publish demo-grpc

on:
  push:
    branches:
      - main
    paths:
      - services/demo-grpc/**
      - charts/demo-grpc/**
      - .github/workflows/publish-demo-grpc.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-demo-grpc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5.10.0
        with:
          # This personal GHCR namespace is intentional and documented in docs/GHCR.md.
          images: ghcr.io/goozdu12/cloud-native-idp-platform/demo-grpc
          tags: |
            # Convenience tag for the latest trusted main build; sha-* is immutable.
            type=raw,value=main
            type=sha,prefix=sha-,format=long

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: services/demo-grpc
          file: services/demo-grpc/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
