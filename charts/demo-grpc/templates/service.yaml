apiVersion: v1
kind: Service
metadata:
  name: {{ include "demo-grpc.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "demo-grpc.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "demo-grpc.selectorLabels" . | nindent 4 }}
  ports:
    - name: grpc
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: grpc
