apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-grpc-logs-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: demo-grpc-logs-dashboard
    app.kubernetes.io/part-of: idp-platform
data:
  demo-grpc-logs-dashboard.json: |-
    {
      "uid": "demo-grpc-logs",
      "title": "demo-grpc Logs",
      "tags": ["demo-grpc", "loki", "logs", "gitops"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 2,
      "refresh": "30s",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "query",
            "label": "Namespace",
            "datasource": {
              "type": "loki",
              "uid": "loki"
            },
            "query": "label_values({job=\"loki.source.kubernetes.pod_logs\"}, namespace)",
            "refresh": 2,
            "sort": 1,
            "multi": false,
            "includeAll": false,
            "current": {
              "selected": true,
              "text": "apps",
              "value": "apps"
            }
          },
          {
            "name": "pod",
            "type": "query",
            "label": "Pod",
            "datasource": {
              "type": "loki",
              "uid": "loki"
            },
            "query": "label_values({namespace=\"$namespace\"}, pod)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": "All",
              "value": "$__all"
            }
          },
          {
            "name": "container",
            "type": "query",
            "label": "Container",
            "datasource": {
              "type": "loki",
              "uid": "loki"
            },
            "query": "label_values({namespace=\"$namespace\", pod=~\"$pod\"}, container)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": "demo-grpc",
              "value": "demo-grpc"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "text",
          "title": "Logs pipeline",
          "gridPos": {
            "h": 4,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "options": {
            "mode": "markdown",
            "content": "## demo-grpc logs\n\n`demo-grpc stdout` → `Kubernetes pod logs` → `Grafana Alloy` → `Loki` → `Grafana`\n\nMain query:\n\n```logql\n{namespace=\"$namespace\", pod=~\"$pod\", container=~\"$container\"}\n```"
          }
        },
        {
          "id": 2,
          "type": "logs",
          "title": "Recent logs",
          "gridPos": {
            "h": 9,
            "w": 24,
            "x": 0,
            "y": 4
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{namespace=\"$namespace\", pod=~\"$pod\", container=~\"$container\"}",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              }
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": true,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": true,
            "enableLogDetails": true,
            "dedupStrategy": "none",
            "sortOrder": "Descending"
          }
        },
        {
          "id": 3,
          "type": "logs",
          "title": "Startup logs",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 13
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{namespace=\"$namespace\", pod=~\"$pod\", container=~\"$container\"} |= \"starting\"",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              }
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": true,
            "wrapLogMessage": true,
            "prettifyLogMessage": true,
            "enableLogDetails": true,
            "dedupStrategy": "none",
            "sortOrder": "Descending"
          }
        },
        {
          "id": 4,
          "type": "logs",
          "title": "Error logs",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 13
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{namespace=\"$namespace\", pod=~\"$pod\", container=~\"$container\"} | json | level=\"ERROR\"",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              }
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": true,
            "wrapLogMessage": true,
            "prettifyLogMessage": true,
            "enableLogDetails": true,
            "dedupStrategy": "none",
            "sortOrder": "Descending"
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Log rate",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 21
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate({namespace=\"$namespace\", pod=~\"$pod\", container=~\"$container\"}[5m]))",
              "legendFormat": "logs/sec",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "logs/s"
            }
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "INFO logs",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 21
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(count_over_time({namespace=\"$namespace\", pod=~\"$pod\", container=~\"$container\"} | json | level=\"INFO\" [$__range]))",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          }
        },
        {
          "id": 7,
          "type": "stat",
          "title": "ERROR logs",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 21
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(count_over_time({namespace=\"$namespace\", pod=~\"$pod\", container=~\"$container\"} | json | level=\"ERROR\" [$__range]))",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          }
        }
      ]
    }
