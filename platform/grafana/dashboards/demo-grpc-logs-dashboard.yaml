apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-grpc-logs-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: demo-grpc-logs-dashboard
    app.kubernetes.io/part-of: idp-platform
data:
  demo-grpc-logs-dashboard.json: |-
    {
      "uid": "demo-grpc-logs",
      "title": "demo-grpc Logs",
      "tags": ["demo-grpc", "loki", "logs", "gitops"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "text",
          "title": "Logs pipeline",
          "gridPos": {
            "h": 4,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "options": {
            "mode": "markdown",
            "content": "## demo-grpc logs\n\n`demo-grpc stdout` → `Kubernetes pod logs` → `Grafana Alloy` → `Loki` → `Grafana`\n\nMain query:\n\n```logql\n{namespace=\"apps\", container=\"demo-grpc\"}\n```"
          }
        },
        {
          "id": 2,
          "type": "logs",
          "title": "Recent demo-grpc logs",
          "gridPos": {
            "h": 9,
            "w": 24,
            "x": 0,
            "y": 4
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{namespace=\"apps\", container=\"demo-grpc\"}",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              }
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": true,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": true,
            "enableLogDetails": true,
            "dedupStrategy": "none",
            "sortOrder": "Descending"
          }
        },
        {
          "id": 3,
          "type": "logs",
          "title": "Startup logs",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 13
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{namespace=\"apps\", container=\"demo-grpc\"} |= \"starting\"",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              }
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": true,
            "wrapLogMessage": true,
            "prettifyLogMessage": true,
            "enableLogDetails": true,
            "dedupStrategy": "none",
            "sortOrder": "Descending"
          }
        },
        {
          "id": 4,
          "type": "logs",
          "title": "Error logs",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 13
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{namespace=\"apps\", container=\"demo-grpc\"} | json | level=\"ERROR\"",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              }
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": true,
            "wrapLogMessage": true,
            "prettifyLogMessage": true,
            "enableLogDetails": true,
            "dedupStrategy": "none",
            "sortOrder": "Descending"
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Log rate",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 21
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate({namespace=\"apps\", container=\"demo-grpc\"}[5m]))",
              "legendFormat": "logs/sec",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "logs/s"
            }
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "INFO logs",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 21
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(count_over_time({namespace=\"apps\", container=\"demo-grpc\"} | json | level=\"INFO\" [$__range]))",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          }
        },
        {
          "id": 7,
          "type": "stat",
          "title": "ERROR logs",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 21
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(count_over_time({namespace=\"apps\", container=\"demo-grpc\"} | json | level=\"ERROR\" [$__range]))",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          }
        }
      ]
    }
