apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-datasource
  namespace: observability
  labels:
    grafana_datasource: "1"
    app.kubernetes.io/name: tempo-datasource
    app.kubernetes.io/part-of: idp-platform
data:
  tempo-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Tempo
        type: tempo
        uid: tempo
        access: proxy
        url: http://tempo.observability.svc.cluster.local:3200
        isDefault: false
        editable: true
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
          tracesToMetrics:
            datasourceUid: prometheus
          serviceMap:
            datasourceUid: prometheus
