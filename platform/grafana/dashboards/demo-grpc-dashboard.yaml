apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-grpc-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: demo-grpc-dashboard
    app.kubernetes.io/part-of: idp-platform
data:
  demo-grpc-dashboard.json: |
    {
      "uid": "demo-grpc",
      "title": "demo-grpc",
      "tags": ["demo-grpc", "prometheus", "gitops", "idp-platform"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Service Up",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "up{namespace=\"apps\",service=\"demo-grpc\"}",
              "legendFormat": "up",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Build Info",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "demo_grpc_build_info{namespace=\"apps\"}",
              "legendFormat": "{{service}} {{version}}",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "name",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto"
          }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "gRPC Request Rate",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(demo_grpc_grpc_requests_total{namespace=\"apps\"}[5m]))",
              "legendFormat": "requests/s",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "gRPC Error Rate",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(demo_grpc_grpc_requests_total{namespace=\"apps\",code!=\"OK\"}[5m]))",
              "legendFormat": "errors/s",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "gRPC p95 Latency",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(demo_grpc_grpc_request_duration_seconds_bucket{namespace=\"apps\"}[5m])) by (le))",
              "legendFormat": "p95",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Requests by Method and Code",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by (method, code) (rate(demo_grpc_grpc_requests_total{namespace=\"apps\"}[5m]))",
              "legendFormat": "{{method}} {{code}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          }
        }
      ]
    }
    {
      "uid": "demo-grpc",
      "title": "demo-grpc",
      "description": "Application metrics for the demo-grpc gRPC service.",
      "tags": ["demo-grpc"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {"from": "now-1h", "to": "now"},
      "templating": {
        "list": [
          {
            "current": {},
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "name": "datasource",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "type": "datasource",
            "label": "Datasource"
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Service Info",
          "description": "Service name and version from build metadata.",
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "targets": [
            {
              "expr": "demo_grpc_build_info{namespace=\"apps\"}",
              "legendFormat": "{{service}} v{{version}}",
              "instant": true,
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "orientation": "auto",
            "colorMode": "none",
            "graphMode": "none"
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Goroutines",
          "description": "Number of goroutines in the process.",
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "targets": [
            {
              "expr": "go_goroutines{namespace=\"apps\", pod=~\"demo-grpc.*\"}",
              "legendFormat": "goroutines",
              "instant": true,
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]},
            "colorMode": "background",
            "graphMode": "none"
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Total Requests",
          "description": "Total gRPC requests since process start.",
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "targets": [
            {
              "expr": "sum(demo_grpc_grpc_requests_total{namespace=\"apps\"})",
              "legendFormat": "total",
              "instant": true,
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]},
            "colorMode": "none",
            "graphMode": "none"
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Error Rate (5m)",
          "description": "gRPC error rate over the last 5 minutes.",
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "targets": [
            {
              "expr": "sum(rate(demo_grpc_grpc_requests_total{namespace=\"apps\", code!=\"OK\"}[5m]))",
              "legendFormat": "errors/s",
              "instant": true,
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]},
            "colorMode": "background",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "red", "value": 0.001}
                ]
              },
              "color": {"mode": "thresholds"}
            }
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Request Rate",
          "description": "gRPC requests per second by method and status code.",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "targets": [
            {
              "expr": "sum by (method, code) (rate(demo_grpc_grpc_requests_total{namespace=\"apps\"}[5m]))",
              "legendFormat": "{{method}} {{code}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {"lineInterpolation": "smooth", "fillOpacity": 10}
            }
          },
          "options": {"tooltip": {"mode": "multi"}}
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Request Latency (p50 / p95)",
          "description": "p50 and p95 gRPC request latency by method.",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, method) (rate(demo_grpc_grpc_request_duration_seconds_bucket{namespace=\"apps\"}[5m])))",
              "legendFormat": "p95 {{method}}",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.50, sum by (le, method) (rate(demo_grpc_grpc_request_duration_seconds_bucket{namespace=\"apps\"}[5m])))",
              "legendFormat": "p50 {{method}}",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {"lineInterpolation": "smooth", "fillOpacity": 10}
            }
          },
          "options": {"tooltip": {"mode": "multi"}}
        }
      ]
    }
