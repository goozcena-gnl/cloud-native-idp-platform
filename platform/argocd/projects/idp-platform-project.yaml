apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: idp-platform
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: idp-platform
    idp.platform/tier: gitops
spec:
  description: Local-first IDP platform GitOps project

  sourceRepos:
    - https://helm.releases.hashicorp.com
    - https://vmware-tanzu.github.io/helm-charts
    - https://falcosecurity.github.io/charts
    - https://opencost.github.io/opencost-helm-chart
    - https://kyverno.github.io/kyverno/
    - https://github.com/goozcena-gnl/cloud-native-idp-platform.git
    - https://prometheus-community.github.io/helm-charts
    - https://grafana-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts

  destinations:
    - server: https://kubernetes.default.svc
      namespace: apps
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: backstage
    - server: https://kubernetes.default.svc
      namespace: falco
    - server: https://kubernetes.default.svc
      namespace: kyverno
    # kube-prometheus-stack renders five component Services in kube-system.
    - server: https://kubernetes.default.svc
      namespace: kube-system
    - server: https://kubernetes.default.svc
      namespace: observability
    - server: https://kubernetes.default.svc
      namespace: opencost
    - server: https://kubernetes.default.svc
      namespace: vault
    - server: https://kubernetes.default.svc
      namespace: velero

  # Local manifests and pinned operator charts create cluster resources and CRDs.
  # See docs/APP_PROJECT_SCOPE.md before narrowing these resource wildcards.
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'

  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
