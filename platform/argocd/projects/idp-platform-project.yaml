apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: idp-platform
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: idp-platform
    idp.platform/tier: gitops
spec:
  description: Local-first IDP platform GitOps project

  sourceRepos:
  - https://helm.releases.hashicorp.com
    - https://vmware-tanzu.github.io/helm-charts
    - https://falcosecurity.github.io/charts
    - https://opencost.github.io/opencost-helm-chart
    - https://kyverno.github.io/kyverno/
    - https://github.com/goozdu12/cloud-native-idp-platform.git
    - https://prometheus-community.github.io/helm-charts
    - https://grafana-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts

  destinations:
    - server: https://kubernetes.default.svc
      namespace: '*'

  clusterResourceWhitelist:
    - group: '*'
      kind: '*'

  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'