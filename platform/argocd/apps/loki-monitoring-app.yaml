apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki-monitoring
  namespace: argocd
  labels:
    app.kubernetes.io/name: loki-monitoring
    app.kubernetes.io/part-of: idp-platform
    idp.platform/tier: observability
spec:
  project: idp-platform

  source:
    repoURL: https://github.com/goozdu12/cloud-native-idp-platform.git
    targetRevision: main
    path: platform/observability/loki-monitoring

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - PruneLast=true
