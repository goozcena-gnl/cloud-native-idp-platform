apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
  labels:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/part-of: idp-platform
    idp.platform/tier: observability
spec:
  project: idp-platform

  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: tempo
      targetRevision: 1.24.4
      helm:
        releaseName: tempo
        valueFiles:
          - $values/platform/helm-values/tempo-values.yaml

    - repoURL: https://github.com/goozdu12/cloud-native-idp-platform.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      - PruneLast=true
      - SkipDryRunOnMissingResource=true
