apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-kubernetes-auth
  namespace: argocd
  labels:
    app.kubernetes.io/name: vault-kubernetes-auth
    app.kubernetes.io/part-of: idp-platform
    idp.platform/tier: secrets
spec:
  project: idp-platform
  source:
    repoURL: https://github.com/goozdu12/cloud-native-idp-platform.git
    targetRevision: main
    path: platform/secrets/vault-kubernetes-auth
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
