apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-grpc
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: idp-platform
    idp.platform/tier: workload
spec:
  project: idp-platform

  source:
    repoURL: https://github.com/goozdu12/cloud-native-idp-platform.git
    targetRevision: main
    path: charts/demo-grpc
    helm:
      releaseName: demo-grpc
      values: |
        image:
          repository: ghcr.io/goozcena-gnl/cloud-native-idp-platform/demo-grpc
          tag: sha-39b20cec49939fd4e90dcd5aef74ee71ee22c800
          pullPolicy: IfNotPresent

        imagePullSecrets:
          - name: ghcr-demo-grpc-pull

        env:
          SERVICE_NAME: demo-grpc
          APP_VERSION: sha-39b20cec49939fd4e90dcd5aef74ee71ee22c800

        service:
          port: 50051

        tracing:
          enabled: true
          otlpEndpoint: tempo.observability.svc.cluster.local:4317

  destination:
    server: https://kubernetes.default.svc
    namespace: apps

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - PruneLast=true
