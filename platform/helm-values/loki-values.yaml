# Local MVP Loki values.
#
# Goal:
# - Run Loki locally in kind.
# - Use monolithic/single-binary mode.
# - Keep it private inside the cluster.
# - Store logs ephemerally for local validation.
#
# Important:
# The Grafana Community Loki chart defaults to scalable components unless
# all non-monolithic replica counts are explicitly set to 0.

fullnameOverride: loki

deploymentMode: Monolithic

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  pattern_ingester:
    enabled: true

  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 24h

  ruler:
    enable_api: true

singleBinary:
  replicas: 1

  persistence:
    enabled: false

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi

# Zero out scalable mode.
backend:
  replicas: 0

read:
  replicas: 0

write:
  replicas: 0

# Zero out distributed mode.
ingester:
  replicas: 0

querier:
  replicas: 0

queryFrontend:
  replicas: 0

queryScheduler:
  replicas: 0

distributor:
  replicas: 0

compactor:
  replicas: 0

indexGateway:
  replicas: 0

bloomPlanner:
  replicas: 0

bloomBuilder:
  replicas: 0

bloomGateway:
  replicas: 0

gateway:
  enabled: false

minio:
  enabled: false

chunksCache:
  enabled: false

resultsCache:
  enabled: false

lokiCanary:
  enabled: false

test:
  enabled: false