# Local MVP values for kube-prometheus-stack.
#
# Goal:
# - Run Prometheus and Grafana locally in kind.
# - Keep services private.
# - Access Grafana through kubectl port-forward only.
#
# Note:
# Grafana needs more resources than the first MVP values because the
# kube-prometheus-stack chart loads dashboards, datasources, sidecars,
# and Grafana 12 internal APIs.

fullnameOverride: kube-prometheus-stack

grafana:
  enabled: true

  adminUser: admin
  adminPassword: admin

  service:
    type: ClusterIP

  persistence:
    enabled: false

  grafana.ini:
    analytics:
      check_for_updates: false
      check_for_plugin_updates: false
    users:
      default_theme: dark

  resources:
    requests:
      cpu: 150m
      memory: 256Mi
    limits:
      cpu: 750m
      memory: 768Mi

  readinessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 30
    timeoutSeconds: 10
    periodSeconds: 10
    failureThreshold: 10

  livenessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 60
    timeoutSeconds: 10
    periodSeconds: 20
    failureThreshold: 10

prometheus:
  enabled: true

  service:
    type: ClusterIP

  prometheusSpec:
    retention: 6h
    scrapeInterval: 30s
    evaluationInterval: 30s
    # Discover ServiceMonitors in all namespaces (e.g. apps/demo-grpc from observability/prometheus).
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}

    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

    storageSpec: {}

alertmanager:
  enabled: true

  service:
    type: ClusterIP

  alertmanagerSpec:
    replicas: 1
    retention: 24h
    storage: {}

  config:
    global:
      resolve_timeout: 5m

    route:
      receiver: local-null
      group_by:
        - namespace
        - alertname
        - severity
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: platform-critical
          matchers:
            - team="platform"
            - severity="critical"
          continue: true

        - receiver: platform-warning
          matchers:
            - team="platform"
            - severity="warning"
          continue: true

        - receiver: gitops-alerts
          matchers:
            - service="argocd"
          continue: true

    receivers:
      - name: local-null

      - name: platform-critical

      - name: platform-warning

      - name: gitops-alerts

    inhibit_rules:
      - source_matchers:
          - severity="critical"
        target_matchers:
          - severity="warning"
        equal:
          - namespace
          - alertname
          - service

