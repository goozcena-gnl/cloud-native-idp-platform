apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform-alerts
  namespace: observability
  labels:
    app.kubernetes.io/name: platform-alerts
    app.kubernetes.io/part-of: idp-platform
    idp.platform/tier: observability
    release: kube-prometheus-stack
spec:
  groups:
    - name: idp-platform.availability
      rules:
        - alert: DemoGrpcDown
          expr: |
            (max(up{namespace="apps", service="demo-grpc"}) == 0)
            or
            absent(up{namespace="apps", service="demo-grpc"})
          for: 2m
          labels:
            severity: critical
            service: demo-grpc
            team: platform
          annotations:
            summary: "demo-grpc target is down"
            description: "Prometheus cannot scrape the demo-grpc metrics target in namespace apps."
            runbook_url: "https://github.com/goozdu12/cloud-native-idp-platform/blob/main/docs/RUNBOOKS.md#demogrpcdown"

        - alert: GrafanaDown
          expr: |
            (max(up{namespace="observability", service="kube-prometheus-stack-grafana"}) == 0)
            or
            absent(up{namespace="observability", service="kube-prometheus-stack-grafana"})
          for: 2m
          labels:
            severity: warning
            service: grafana
            team: platform
          annotations:
            summary: "Grafana target is down"
            description: "Prometheus cannot scrape the Grafana target in namespace observability."
            runbook_url: "https://github.com/goozdu12/cloud-native-idp-platform/blob/main/docs/RUNBOOKS.md#grafanadown"

        - alert: LokiDown
          expr: |
            (max(up{namespace="observability", service="loki"}) == 0)
            or
            absent(up{namespace="observability", service="loki"})
          for: 2m
          labels:
            severity: critical
            service: loki
            team: platform
          annotations:
            summary: "Loki target is down"
            description: "Prometheus cannot scrape the Loki metrics target in namespace observability."
            runbook_url: "https://github.com/goozdu12/cloud-native-idp-platform/blob/main/docs/RUNBOOKS.md#lokidown"

    - name: idp-platform.gitops
      rules:
        - alert: TempoDown
          expr: |
            (max(up{namespace="observability", service="tempo"}) == 0)
            or
            absent(up{namespace="observability", service="tempo"})
          for: 2m
          labels:
            severity: critical
            service: tempo
            component: tracing
          annotations:
            summary: "Tempo is down"
            description: "Tempo is not being scraped by Prometheus or is not reporting as up."
            runbook_url: "https://github.com/goozdu12/cloud-native-idp-platform/blob/main/docs/RUNBOOKS.md#tempodown"

        - alert: ArgoCDAppOutOfSync
          expr: |
            sum(argocd_app_info{project="idp-platform", sync_status!="Synced"}) > 0
          for: 2m
          labels:
            severity: warning
            service: argocd
            team: platform
          annotations:
            summary: "One or more ArgoCD applications are OutOfSync"
            description: "At least one ArgoCD application in project idp-platform is not Synced."
            runbook_url: "https://github.com/goozdu12/cloud-native-idp-platform/blob/main/docs/RUNBOOKS.md#argocdappoutofsync"

        - alert: ArgoCDAppUnhealthy
          expr: |
            sum(argocd_app_info{project="idp-platform", health_status!="Healthy"}) > 0
          for: 2m
          labels:
            severity: critical
            service: argocd
            team: platform
          annotations:
            summary: "One or more ArgoCD applications are unhealthy"
            description: "At least one ArgoCD application in project idp-platform is not Healthy."
            runbook_url: "https://github.com/goozdu12/cloud-native-idp-platform/blob/main/docs/RUNBOOKS.md#argocdappunhealthy"

        - alert: ArgoCDApplicationControllerMetricsDown
          expr: |
            (max(up{namespace="argocd", service="argocd-application-controller-metrics"}) == 0)
            or
            absent(up{namespace="argocd", service="argocd-application-controller-metrics"})
          for: 2m
          labels:
            severity: critical
            service: argocd-application-controller
            team: platform
          annotations:
            summary: "ArgoCD application-controller metrics target is down"
            description: "Prometheus cannot scrape argocd-application-controller metrics."
            runbook_url: "https://github.com/goozdu12/cloud-native-idp-platform/blob/main/docs/RUNBOOKS.md#argocdapplicationcontrollermetricsdown"

        - alert: ArgoCDRepoServerMetricsDown
          expr: |
            (max(up{namespace="argocd", service="argocd-repo-server-metrics"}) == 0)
            or
            absent(up{namespace="argocd", service="argocd-repo-server-metrics"})
          for: 2m
          labels:
            severity: warning
            service: argocd-repo-server
            team: platform
          annotations:
            summary: "ArgoCD repo-server metrics target is down"
            description: "Prometheus cannot scrape argocd-repo-server metrics."
            runbook_url: "https://github.com/goozdu12/cloud-native-idp-platform/blob/main/docs/RUNBOOKS.md#argocdreposervermetricsdown"

        - alert: ArgoCDServerMetricsDown
          expr: |
            (max(up{namespace="argocd", service="argocd-server-metrics"}) == 0)
            or
            absent(up{namespace="argocd", service="argocd-server-metrics"})
          for: 2m
          labels:
            severity: warning
            service: argocd-server
            team: platform
          annotations:
            summary: "ArgoCD server metrics target is down"
            description: "Prometheus cannot scrape argocd-server metrics."
            runbook_url: "https://github.com/goozdu12/cloud-native-idp-platform/blob/main/docs/RUNBOOKS.md#argocdservermetricsdown"
