# Platform namespaces for the local IDP (pre-ArgoCD bootstrap).
#
# These namespaces are created manually from versioned YAML for now.
# Once ArgoCD is installed, it becomes the GitOps reconciler and may
# manage these namespaces declaratively instead.
#
# Pod Security notes:
# - Strict "enforce" is intentionally NOT set yet, because platform Helm
#   charts (ingress, observability, security tooling) may need custom
#   permissions during early bootstrap.
# - Only the "apps" namespace carries warn/audit restricted labels, so we
#   get visibility into workload posture without blocking platform charts.
---
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    app.kubernetes.io/part-of: idp-platform
    idp.platform/tier: gitops
    idp.platform/managed-by: manual-bootstrap
---
apiVersion: v1
kind: Namespace
metadata:
  name: platform-system
  labels:
    app.kubernetes.io/part-of: idp-platform
    idp.platform/tier: platform
    idp.platform/managed-by: manual-bootstrap
---
apiVersion: v1
kind: Namespace
metadata:
  name: apps
  labels:
    app.kubernetes.io/part-of: idp-platform
    idp.platform/tier: workloads
    idp.platform/managed-by: manual-bootstrap
    # Pod Security Admission: observe restricted violations without enforcing.
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
---
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    app.kubernetes.io/part-of: idp-platform
    idp.platform/tier: observability
    idp.platform/managed-by: manual-bootstrap
---
apiVersion: v1
kind: Namespace
metadata:
  name: security
  labels:
    app.kubernetes.io/part-of: idp-platform
    idp.platform/tier: security
    idp.platform/managed-by: manual-bootstrap
