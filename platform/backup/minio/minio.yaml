apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: velero
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: idp-platform
    idp.platform/tier: backup
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: velero
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: idp-platform
    idp.platform/tier: backup
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/part-of: idp-platform
        idp.platform/tier: backup
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          image: quay.io/minio/minio:latest
          args:
            - server
            - /data
            - --console-address
            - :9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: velero-minio-root
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: velero-minio-root
                  key: root-password
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-velero-bucket
  namespace: velero
  labels:
    app.kubernetes.io/name: minio-create-velero-bucket
    app.kubernetes.io/part-of: idp-platform
    idp.platform/tier: backup
  annotations:
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-create-velero-bucket
        app.kubernetes.io/part-of: idp-platform
        idp.platform/tier: backup
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: mc
          image: quay.io/minio/mc:latest
          command:
            - sh
            - -c
            - |
              set -eu

              mkdir -p "${MC_CONFIG_DIR}"

              echo "Waiting for MinIO API..."
              connected="false"

              for attempt in $(seq 1 30); do
                if mc --config-dir "${MC_CONFIG_DIR}" alias set local http://minio.velero.svc.cluster.local:9000 "${MINIO_ROOT_USER}" "${MINIO_ROOT_PASSWORD}"; then
                  connected="true"
                  echo "MinIO API is reachable."
                  break
                fi

                echo "  attempt ${attempt}/30: MinIO API not ready yet"
                sleep 5
              done

              if [ "${connected}" != "true" ]; then
                echo "ERROR: MinIO API did not become reachable."
                exit 1
              fi

              mc --config-dir "${MC_CONFIG_DIR}" mb --ignore-existing local/velero
              mc --config-dir "${MC_CONFIG_DIR}" ls local
          env:
            - name: HOME
              value: /tmp
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: velero-minio-root
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: velero-minio-root
                  key: root-password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
